name: Validate Curriculum

on:
  push:
    branches: [main]
    paths:
      - 'curriculum/**'
      - 'blueprints/**'
      - '.forge/validation/**'
  pull_request:
    branches: [main]
    paths:
      - 'curriculum/**'
      - 'blueprints/**'
      - '.forge/validation/**'
  schedule:
    # Run weekly on Mondays at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      sdk_versions:
        description: 'SDK versions to test (comma-separated)'
        required: false
        default: 'latest'

jobs:
  validate-syntax:
    name: Validate Syntax
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: |
          echo "Checking Python syntax..."
          find curriculum blueprints -name "*.py" -exec python -m py_compile {} \;
          echo "✓ All Python files have valid syntax"

  validate-examples:
    name: Validate Examples
    runs-on: ubuntu-latest
    needs: validate-syntax

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic pytest pyyaml

      - name: Run validation tests
        env:
          FORGE_VALIDATION_MODE: "1"
        run: |
          cd .forge/validation
          python -m pytest tests/ -v --tb=short

  validate-sdk-matrix:
    name: SDK Version Matrix
    runs-on: ubuntu-latest
    needs: validate-syntax
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic pyyaml

      - name: Determine SDK versions
        id: versions
        run: |
          if [ "${{ github.event.inputs.sdk_versions }}" = "latest" ] || [ -z "${{ github.event.inputs.sdk_versions }}" ]; then
            echo "versions=0.39.0 0.40.0" >> $GITHUB_OUTPUT
          else
            echo "versions=${{ github.event.inputs.sdk_versions }}" >> $GITHUB_OUTPUT
          fi

      - name: Run SDK matrix tests
        env:
          FORGE_VALIDATION_MODE: "1"
        run: |
          cd .forge/validation/sdk-matrix
          python matrix_test.py --versions ${{ steps.versions.outputs.versions }} --report --output matrix_report.html

      - name: Upload matrix report
        uses: actions/upload-artifact@v4
        with:
          name: sdk-matrix-report
          path: .forge/validation/sdk-matrix/matrix_report.html

  update-badges:
    name: Update Validation Badges
    runs-on: ubuntu-latest
    needs: [validate-examples, validate-sdk-matrix]
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate badges
        run: |
          python .forge/validation/badges/generate_badges.py

      - name: Commit badge updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Update validation badges"
          file_pattern: ".forge/validation/badges/*.json .forge/validation/badges/*.svg"
