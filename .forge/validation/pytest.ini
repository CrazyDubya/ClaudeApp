[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for different test types
markers =
    live: marks tests that require API access
    unit: marks unit tests that don't require API

# Default options
addopts = -v --tb=short

# Ignore deprecation warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
